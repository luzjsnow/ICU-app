name: Build & Release Android APK and iOS Scriptable

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run clinical calculation unit tests
        run: npm test

      - name: Build web assets & iOS Scriptable bundle
        run: npm run build:all

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/ICU-Pump-Assistant.apk
          cp "dist-scriptable/ICU泵助手.js" release-assets/ICU-Pump-Scriptable.js
          cp "dist-scriptable/ICU泵助手.js" "release-assets/ICU泵助手.js"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ICU-Pump-Release-Bundle
          path: release-assets/*

      - name: Publish to GitHub Releases (enables QR direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0-latest"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "ICU泵助手 最新离线版 ($TAG)" \
              --notes "### 安装说明\n- **Android 安卓手机**：下载 \`ICU-Pump-Assistant.apk\` 直接安装。\n- **iPhone (iOS)**：在 App Store 免费安装 **Scriptable**，下载 \`ICU-Pump-Scriptable.js\`（或 \`ICU泵助手.js\`）拷贝到 Scriptable 运行即可离线全屏使用。"
          fi
